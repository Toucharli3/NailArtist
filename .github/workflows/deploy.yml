# Déploiement automatique du site sur GitHub Pages.
# Activez-le une seule fois : Settings → Pages → Source = "GitHub Actions".
# Ensuite, chaque push sur la branche par défaut republie le site.
name: Déployer sur GitHub Pages

on:
  push:
    # Se déclenche sur la branche par défaut du dépôt (actuelle) et sur main
    # (si vous renommez/fusionnez plus tard). Ajoutez votre branche si besoin.
    branches: ["main", "master", "claude/nail-artist-portfolio-site-5ujbmv"]
  workflow_dispatch: {}   # permet de relancer manuellement depuis l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on ne coupe pas une publication en cours.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Téléverser le site (dossier racine)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
