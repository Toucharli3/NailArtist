# Configuration du panneau d'administration (Pages CMS — pagescms.org)
# Permet à Margot de gérer ses photos depuis un panneau web, sans coder.
# Voir GUIDE-ADMIN.md pour la connexion.

media:
  - name: images
    label: Photos
    input: assets/images
    output: assets/images
    extensions: [jpg, jpeg, png, webp, avif, svg]

content:
  - name: galerie
    label: Galerie photos
    description: Ajoute, réordonne ou supprime les photos affichées dans la galerie du site.
    type: file
    path: content/gallery.json
    list: true
    fields:
      - name: image
        label: Photo
        type: image
        required: true
      - name: caption
        label: Légende (facultatif)
        type: string
      - name: category
        label: Catégorie
        type: select
        default: nailart
        options:
          values:
            - { value: gel, label: "Pose gel" }
            - { value: nailart, label: "Nail art" }
            - { value: french, label: "French" }
            - { value: entretien, label: "Entretien" }

  - name: prestations
    label: Prestations & tarifs
    description: Modifie les prestations, prix et durées affichés sur le site.
    type: file
    path: content/services.json
    list: true
    fields:
      - name: title
        label: Nom de la prestation
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: price
        label: Prix (ex. « 50 € » ou « Sur devis »)
        type: string
      - name: duration
        label: Durée (ex. « 1 h 30 »)
        type: string
